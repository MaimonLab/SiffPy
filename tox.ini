[tox]
envlist = py{39, 310, 311, 312, 313}-numpy{1,2}-suite2p{src,home}

[testenv]
# install pytest in the virtualenv where commands will be executed
deps = 
    pytest
    suite2phome: suite2p @ git+https://github.com/StephenThornquist/suite2p.git
    suite2psrc: suite2p
    numpy1: numpy < 2
    numpy2: numpy >= 2
    # suite2p
    dropbox
commands =
    pytest tests